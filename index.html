<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <!-- Meta tags obrigatórias -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Questionário de Depressão</title>

    <!-- Estilos para responsividade -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
      }
      /* Fullscreen WebKit */
      :-webkit-full-screen #canvas,
      :-webkit-full-screen {
        width: 100%;
        height: 100%;
      }
      /* Runner default styles */
      canvas {
        image-rendering: optimizeSpeed;
        -webkit-interpolation-mode: nearest-neighbor;
        -ms-touch-action: none;
        touch-action: none;
        border: 0;
      }
      div.gm4html5_div_class {
        margin: 0;
        padding: 0;
        border: 0;
      }
    </style>
  </head>

  <body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
      <!-- Canvas do jogo -->
      <canvas id="canvas" width="800" height="1131">
        Seu navegador não suporta HTML5 Canvas.
      </canvas>
    </div>

    <!-- Scripts do GameMaker export -->
    <script type="text/javascript" src="html5game/questionario depressao.js?cachebust"></script>
    <script>
      // Inicializa o jogo após carregar
      window.onload = function() {
        GameMaker_Init();
        resizeCanvas();
      };
      // Ajusta tamanho do canvas em caso de redimensionamento
      function resizeCanvas() {
        const c = document.getElementById('canvas');
        c.style.width = window.innerWidth + 'px';
        c.style.height = window.innerHeight + 'px';
      }
      window.addEventListener('resize', resizeCanvas);
    </script>
  </body>
</html>
